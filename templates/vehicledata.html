<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Insurance Prediction</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="page-wrap">
        <section class="card">
            <header class="card-header">
                <p class="badge">Portfolio Project</p>
                <h1>Vehicle Insurance Prediction</h1>
                <p class="subtitle">Predict whether a customer is likely to buy vehicle insurance.</p>
            </header>

            <form method="post" action="/" class="prediction-form">
                <div class="grid">
                    <div class="field">
                        <label for="Gender">Gender</label>
                        <select id="Gender" name="Gender" required>
                            <option value="1">Male</option>
                            <option value="0">Female</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="Age">Age</label>
                        <input type="number" id="Age" name="Age" min="18" max="100" placeholder="e.g. 35" required>
                    </div>

                    <div class="field">
                        <label for="Driving_License">Driving License</label>
                        <select id="Driving_License" name="Driving_License" required>
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="Region_Code">Region Code</label>
                        <input type="number" step="0.01" id="Region_Code" name="Region_Code" placeholder="e.g. 28.0" required>
                    </div>

                    <div class="field">
                        <label for="Previously_Insured">Previously Insured</label>
                        <select id="Previously_Insured" name="Previously_Insured" required>
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="Annual_Premium">Annual Premium</label>
                        <input type="number" step="0.01" id="Annual_Premium" name="Annual_Premium" placeholder="e.g. 40454.0" required>
                    </div>

                    <div class="field">
                        <label for="Policy_Sales_Channel">Policy Sales Channel</label>
                        <input type="number" step="0.01" id="Policy_Sales_Channel" name="Policy_Sales_Channel" placeholder="e.g. 26.0" required>
                    </div>

                    <div class="field">
                        <label for="Vintage">Vintage</label>
                        <input type="number" id="Vintage" name="Vintage" min="1" placeholder="Customer days with company" required>
                    </div>

                    <div class="field">
                        <label for="Vehicle_Age_lt_1_Year">Vehicle Age &lt; 1 Year</label>
                        <select id="Vehicle_Age_lt_1_Year" name="Vehicle_Age_lt_1_Year" required>
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="Vehicle_Age_gt_2_Years">Vehicle Age &gt; 2 Years</label>
                        <select id="Vehicle_Age_gt_2_Years" name="Vehicle_Age_gt_2_Years" required>
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>
                    </div>

                    <div class="field field-full">
                        <label for="Vehicle_Damage_Yes">Vehicle Damage History</label>
                        <select id="Vehicle_Damage_Yes" name="Vehicle_Damage_Yes" required>
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-primary">Predict Interest</button>
                    <a href="/train" class="btn btn-secondary">Run Training</a>
                </div>
            </form>

            {% if context %}
                <div class="result">
                    <h2>Prediction Result</h2>
                    <p>{{ context }}</p>
                </div>
            {% endif %}
        </section>
    </main>
</body>
</html>
